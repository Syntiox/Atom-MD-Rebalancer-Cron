name: Atom-MD Rebalancer Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  ping-rebalancer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Logs Folder and Timestamp
        run: |
          mkdir -p logs
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          echo "LOG_FILE=logs/log_${TIMESTAMP}.json" >> $GITHUB_ENV

      - name: Ping Rebalancer API
        run: |
          curl -s -X GET "https://atom.syntiox.top/api/rebalancer" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
          -o ${{ env.LOG_FILE }} \
          --fail
          
          echo "--- API Response ---"
          cat ${{ env.LOG_FILE }}

      - name: Upload Logs as Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: rebalancer-cron-logs
          path: ${{ env.LOG_FILE }}

      - name: Clean up old logs
        run: |
    
          find logs/ -name "log_*.json" -mtime +1 -delete

      - name: Commit and Push logs to Repository
        run: |
          git config --global user.name "Syntiox Bot"
          git config --global user.email "no-reply@s4z.top"
          git add logs/
          
          git diff-index --quiet HEAD || git commit -m "📝 Add log & cleanup old logs for $(date +"%Y-%m-%d %H:%M:%S")"
          git push
